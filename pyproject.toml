[project]
name = "devclean"
version = "0.3.0"
description = "Evidence-driven disk cleanup for developers on macOS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gaurav Sood"},
]
keywords = ["cleanup", "disk-space", "developer-tools", "macos", "storage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.27.2",
    "rich>=13.0.0",
    "tomlkit>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.16.5",
    "pre-commit>=3.0.0",
    "pyright>=1.1.390",
    "pydoclint>=0.5",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]

[project.urls]
Homepage = "https://github.com/gojiplus/devclean"
Repository = "https://github.com/gojiplus/devclean"
Issues = "https://github.com/gojiplus/devclean/issues"
Documentation = "https://github.com/gojiplus/devclean#readme"

[project.scripts]
devclean = "devclean.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "devclean"
module-root = ""

[tool.pyright]
include = ["devclean"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=devclean --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "B008", "B904", "D102", "D107", "D202", "D413", "E501", "UP035",
    # Disk-cleanup tool: shells out to du/find/lsof/port by design, and best-effort
    # probes deliberately swallow per-path errors. Mirrors the bandit skips below.
    "S110", "S112", "S603", "S607",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S108: tests use literal /tmp paths as fixtures, never as real temp files.
# PT019: @patch injects mocks as leading-underscore params ruff mistakes for fixtures.
"tests/**" = ["S101", "S108", "PT019", "D"]
"docs/**" = ["D"]

[tool.bandit]
# Ignore subprocess warnings - this is a system administration tool
exclude_dirs = ["tests"]
skips = ["B404", "B603", "B607", "B110", "B112"]
